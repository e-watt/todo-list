<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
  </head>
  <body>
    <button command="show-modal" commandfor="task-dialog">Add task</button>

    <dialog id="task-dialog">
      <div class="dialogRow">
        <div class="inputItem">
          <label for="title">Title</label>
          <input type="text" id="title">
        </div>

        <div class="inputItem">
          <label for="desc">Description</label>
          <input type="text" id="desc">
        </div>
      </div>

      <div class="dialogRow">
        <div class="inputItem">
          <label for="completed">Completed</label>
          <input type="checkbox" id="completed">
        </div>

        <div class="inputItem">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate">
        </div>
      </div>

      <div class="dialogRow">
        <div class="inputItem">
          <label for="priority">Priority(0-4)</label>
          <input type="number" id="priority">
        </div>
      </div>

      <button commandfor="task-dialog" command="close">Close</button>
      <button commandfor="task-dialog" command="close" class="createTaskBtn">Create task</button>
    </dialog>

    <div class="content"></div>
  </body>
</html>
